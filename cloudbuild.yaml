steps:
  - id: "build"
    name: "gcr.io/cloud-builders/docker"
    entrypoint: bash
    env: ["DOCKER_BUILDKIT=1"]
    args:
      - -c
      - |
        docker build \
        --target production \
        -t $LOCATION-docker.pkg.dev/${PROJECT_ID}/cloud-run-source-deploy/project07-api-server:$COMMIT_SHA .

  - name: "gcr.io/cloud-builders/docker"
    args:
      - "push"
      - "$LOCATION-docker.pkg.dev/${PROJECT_ID}/cloud-run-source-deploy/project07-api-server:$COMMIT_SHA"

  - name: "gcr.io/google.com/cloudsdktool/cloud-sdk"
    args:
      - "gcloud"
      - "run"
      - "services"
      - "update"
      - "project07-api-server"
      - "--image=$LOCATION-docker.pkg.dev/${PROJECT_ID}/cloud-run-source-deploy/project07-api-server:$COMMIT_SHA"
      - "--region=$LOCATION"

options:
  logging: CLOUD_LOGGING_ONLY
