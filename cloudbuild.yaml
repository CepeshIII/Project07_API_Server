steps:
  - name: "ubuntu"
    args: ["echo", "hello world"]

  - name: "gcr.io/cloud-builders/docker"
    args:
      [
        "build",
        "--target",
        "production",
        "-t",
        "europe-central2-docker.pkg.dev/${PROJECT_ID}/cloud-run-source-deploy/project07-api-server:$COMMIT_SHA",
        "",
        ".",
      ]

  - name: "gcr.io/cloud-builders/docker"
    args:
      - "push"
      - "europe-central2-docker.pkg.dev/${PROJECT_ID}/cloud-run-source-deploy/project07-api-server:$COMMIT_SHA"

images:
  - "europe-central2-docker.pkg.dev/${PROJECT_ID}/cloud-run-source-deploy/project07-api-server:$COMMIT_SHA"

options:
  logging: CLOUD_LOGGING_ONLY
