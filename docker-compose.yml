services:
    db:
        image: postgres:16.3
        environment:
            POSTGRES_DB: social
            POSTGRES_USER: admin
            POSTGRES_PASSWORD: adminpassword
        volumes:
            - db-data:/var/lib/postgresql/data
            - ./scripts:/docker-entrypoint-initdb.d
        ports:
            - "5433:5432"

volumes:
    db-data:
